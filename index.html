<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover</title>
    <link rel="stylesheet" href="/style/index.css">
    <script src="/style/index.js" defer></script>
</head>
<body>
    




<!-- =========================
         LOVE LINK COVER PAGE
    ========================== -->

    <main class="cover_page">

        <!-- LoveLink Logo -->
        <header class="logo">
            <h1>အခုတစ်လော ကိုကိုခိုးလုပ်နေတဲ့ လျှို့ဝှက်ချက်<span>♡</span></h1>
            <p>အဝေးက ချစ်သူလေးအတွက်</p>
        </header>


        <!-- Character -->
        <section class="character-section">

            <img
                id="character"
                src="/lib/img/TransparentCha/NormalTranCat.png"
                alt="LoveLink character"
            >


        </section>
            <!-- =========================
         PASSWORD SCREEN
        ========================== -->

    <!-- ⭐ ADDED: Password screen -->

    
            <div id="passwordScreen">

        <h2>လျှို့ဝှက်နံပါတ်ထည့်ပါ ❤️</h2>

        <input
            type="password"
            id="passwordInput"
            placeholder="Password"
        >

        <button id="passwordButton" type="button">
            💕 Enter
        </button>

        <p id="passwordMessage"></p>

        </div>

    <!-- ⭐ END ADDED -->

        <!-- Question -->
        <section class="question-section">

            <h2 id="question">
                ဘေဘီ ကိုကို့ကို ချစ်လား? ❤️
            </h2>

            <!-- Buttons -->
            <div class="answer-buttons">

                <button
                    id="yesButton"
                    class="answer-button yes-button"
                    type="button"
                >
                    ❤️ ချစ်တယ်။
                </button>

                <button
                    id="noButton"
                    class="answer-button no-button"
                    type="button"
                >
                    💔 မချစ်ဘူး။
                </button>

            </div>

        </section>


        <div id="love-input" class="love-input">
    <h3>ချစ်ရင် ကိုကို့ ကို အာဘွားပေးရမှာပေါ့။ အာဘွားပေး ❤️</h3>

    <input
        type="text"
        id="loveAnswer"
        placeholder="ဒီမှာ (အာဘွား) ပေးပါ"
    >

    <button id="submitAnswer" type="button">
        💕 Continue
    </button>

    <p id="inputMessage"></p>
    </div>


    </main>








</body>
</html>
